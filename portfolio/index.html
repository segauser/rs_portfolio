<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfolio</title>
  <link rel="shortcut icon" href="/favicon.ico">
</head>
<body class="page">
  <header class="page__header">
    <div class="page__logo">
      <img src="/" alt="logo">
    </div>
    <nav class="page__nav">
      <ul class="nav page__nav">
        <li class="nav__item">About me</li>
        <li class="nav__item">Portfolio</li>
        <li class="nav__item">Price</li>
        <li class="nav__item">FAQ</li>
        <li class="nav__item">Contacts</li>
      </ul>
    </nav>
  </header>
  <section class="hero page__hero">
    <div class="hero__vertical-line">
      <div class="vertical-year">2025</div>
      <div class="vertical-line"></div>
      <div class="vertical-description">Best Photographer by MAX</div>
    </div>
    <div class="main hero__main">
      <div class="main__item">
        <div class="main__info">
          <div class="stat main__info">
            <div class="stat__item">
              <div class="stat__plus">+</div>
              <div class="stat__descr">
                <div class="stat__numb">487</div>
                <div class="stat__text">Photo sessions</div>
              </div>
            </div>
            <div class="stat__item">
              <div class="stat__item">
                <div class="stat__plus">+</div>
                <div class="stat__descr">
                  <div class="stat__numb">356</div>
                  <div class="stat__text">Satisfied clients</div>
              </div>
            </div>
            </div>
          </div>
          <div class="main__header">Professional photographer</div>
          <div class="main__description">Capture the Moment. Tell Your Story.</div>
        </div>
        <div class="scroll">
          <span>Scroll down</span>
          <svg width="16" height="9" viewBox="0 0 16 9" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M15 1L8 8L1 1" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </div>
      </div>
      <div class="main__item">
        <img src="/" alt="pic1">
      </div>
      <div class="main__item">
        <figure class="main__item main__item_intro">
          <img src="/" alt="pic2">
          <figcaption>Hi! I’m Vera, a photographer. For me, photography is more than just an image. </figcaption>
        </figure>
        <!-- <div class="picture">
          <img src="/" alt="pic2">
        </div>
        <div class="picture_intro"></div> -->
      </div>
    </div>
  </section>
  <section class="page__about"></section>
  <section class="page__portfolio"></section>
  <section class="page__price"></section>
  <section class="page__faq"></section>
  <footer class="page__footer"></footer>
</body>
</html>
